{% extends "base.html" %}

{% block title %}Delete ticket | Task Manager{% endblock %}

{% block content %}
<div class="mx-auto max-w-xl rounded-lg border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-700 dark:bg-slate-900">
    <h1 class="text-2xl font-bold">Delete ticket?</h1>
    <p class="mt-3 text-slate-600 dark:text-slate-300">
        Are you sure you want to delete “{{ ticket.title }}”? This action cannot be undone.
    </p>
    <form method="post" action="{{ url('tickets:ticket-delete', args=[ticket.pk]) }}" class="mt-6 flex gap-3">
        <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
        <button type="submit" class="rounded-md bg-red-600 px-4 py-2 text-sm font-medium text-white hover:bg-red-700">
            Delete ticket
        </button>
        <a href="{{ url('tickets:ticket-detail', args=[ticket.pk]) }}"
            class="rounded-md border border-slate-300 px-4 py-2 text-sm dark:border-slate-600">
            Cancel
        </a>
    </form>
</div>
{% endblock %}
