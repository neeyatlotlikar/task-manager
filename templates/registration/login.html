{% extends "base.html" %}

{% block content %}
<div class="mx-auto max-w-sm rounded-lg border border-slate-200 bg-white p-6 dark:border-slate-700 dark:bg-slate-900">
    <h1 class="mb-4 text-xl font-bold">Log in</h1>

    <form method="post">
        {% csrf_token %}

        {% if form.errors %}
        <p class="mb-4 rounded bg-red-50 p-3 text-sm text-red-700">
            Invalid username or password.
        </p>
        {% endif %}

        {{ form.username.label_tag }}
        {{ form.username }}

        <br>

        {{ form.password.label_tag }}
        {{ form.password }}

        <input type="hidden" name="next" value="{{ next }}">

        <button class="mt-4 w-full rounded-md bg-blue-600 px-4 py-2 text-white">
            Log in
        </button>
    </form>
</div>
{% endblock %}
