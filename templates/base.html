<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Task Manager{% endblock %}</title>

    <link rel="stylesheet" href="{{ static('css/output.css') }}">
</head>

<body class="min-h-full bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100">

    <header class="border-b border-slate-200 dark:border-slate-800">
        <div class="mx-auto max-w-5xl px-4 py-4 flex items-center justify-between">
            <a href="{{ url('tickets:ticket-list') }}" class="font-bold text-lg">Task Manager</a>

            {% if user.is_authenticated %}
            <div class="flex items-center gap-4">
                <span class="text-sm">{{ user.username }}</span>
                <form method="post" action="{{ url('logout') }}">
                    <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
                    <button type="submit"
                        class="rounded-md bg-slate-900 px-3 py-2 text-sm text-white dark:bg-white dark:text-slate-900">
                        Log out
                    </button>
                </form>
            </div>
            {% else %}
            <a href="{{ url('login') }}" class="text-sm font-medium">Log in</a>
            {% endif %}
        </div>
    </header>

    <main class="mx-auto max-w-5xl px-4 py-8">
        {% for message in messages %}
        <div class="mb-4 rounded-md bg-blue-50 p-3 text-sm text-blue-800" role="status">{{ message }}</div>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>

</body>

</html>
