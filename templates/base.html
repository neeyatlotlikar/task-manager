{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Task Manager{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <script src="{% static 'js/htmx.min.js' %}" defer></script>
    <script src="{% static 'js/alpine.min.js' %}" defer></script>

    {% if request.environ.DEBUG == "True" %}
    <!-- Development-only Tailwind browser build -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
    {% endif %}
</head>

<body class="min-h-full bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100"
    hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>

    <header class="border-b border-slate-200 dark:border-slate-800">
        <div class="mx-auto max-w-5xl px-4 py-4 flex items-center justify-between">
            <a href="{% url 'tickets:ticket-list' %}" class="font-bold text-lg">Task Manager</a>

            {% if user.is_authenticated %}
            <div x-data="{ open: false }" class="relative">
                <button @click="open = !open"
                    class="rounded-md bg-slate-900 px-3 py-2 text-sm text-white dark:bg-white dark:text-slate-900">
                    {{ user.username }}
                </button>

                <div x-show="open" @click.outside="open = false" x-transition
                    class="absolute right-0 mt-2 w-44 rounded-md border border-slate-200 bg-white p-2 shadow-lg dark:border-slate-700 dark:bg-slate-800">
                    <a href="{% url 'logout' %}"
                        class="block rounded px-3 py-2 hover:bg-slate-100 dark:hover:bg-slate-700">
                        Log out
                    </a>
                </div>
            </div>
            {% else %}
            <a href="{% url 'login' %}" class="text-sm font-medium">Log in</a>
            {% endif %}
        </div>
    </header>

    <main id="ticket-content" class="mx-auto max-w-5xl px-4 py-8">
        {% block content %}{% endblock %}
    </main>

</body>

</html>
